name: Apple Refurb Monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apple-refurb-monitor
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      APPLE_REFURB_URL: "https://www.apple.com/jp/shop/refurbished/mac/mac-mini"
      APPLE_REFURB_FILTER: "Mac mini"
      APPLE_REFURB_STATE_FILE: data/apple_refurb_state.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run tests
        run: python -B -m unittest -v

      - name: Check Apple refurbished listings
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -B apple_refurb_watch.py --max-print 10

      - name: Commit monitor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apple_refurb_state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update Apple refurb monitor state"
            git push
          fi
